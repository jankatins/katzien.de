# rumdl configuration - Google developer documentation style
# Based on https://google.github.io/styleguide/docguide/style.html

[global]
flavor = "hugo"
exclude = [
    ".git",
    ".github",
    "node_modules",
    "vendor",
    "dist",
    "build",
    "CHANGELOG.md",
    "LICENSE.md",
]
respect-gitignore = true
# Set global line length (used by MD013 and other line-length rules)
line_length = 120

# ATX-style headings required
[MD003]
style = "atx"

# Unordered list style: dash
[MD004]
style = "dash"

# 4-space indent for nested lists
[MD007]
indent = 4

# Strict mode: no trailing spaces allowed (Google uses backslash for line breaks)
[MD009]
strict = true

[MD013]
# https://rumdl.dev/md013/
# Reflow at semantic line breaks: https://sembr.org/
reflow = true
reflow-mode = "semantic-line-breaks"
code-blocks = false  # Don't check code blocks
tables = false  # Don't check tables
headings = false  # Check headings
paragraphs = true  # Check paragraph/regular text
strict = false  # Exceptions for URLs, etc.
length-mode = "visual"  # How to count line length: "visual", "chars", or "bytes" (default: "visual")
abbreviations = ["Assn", "Univ", "stat"]  # Add custom abbreviations for sentence-per-line mode
require-sentence-capital = true  # Require uppercase after periods for sentence detection

# No trailing punctuation in headings
[MD026]
punctuation = ".,;:!。，；：！"

[MD029]
# https://github.com/rvben/rumdl/blob/main/docs/md029.md
# ordered lists: either all 1. or properly ordered.
style = "one-or-ordered"

# Fenced code blocks only (no indented code blocks)
[MD046]
style = "fenced"

# Emphasis with underscores
[MD049]
style = "underscore"

# Strong with asterisks
[MD050]
style = "asterisk"
